[project]
name = "application"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "feedparser",
    "flask",
    "flask-sqlalchemy",
    "gunicorn",
    "lxml-html-clean",
    "opml",
    "psycopg[binary]",
    "python-dotenv",
    "requests",
    "sqlalchemy",
    "strawberry-graphql",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 160
