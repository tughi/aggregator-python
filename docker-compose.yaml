services:
  app:
    build:
      context: ./application
    environment:
      - DATABASE_URL
    volumes:
      - ./application/dumps:/app/dumps:rw
    restart: unless-stopped
  web:
    build: ./clients/web
    restart: unless-stopped
  sync:
    build:
      context: ./application
    environment:
      - DATABASE_URL
    command: crond -f
    user: root
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    depends_on:
      - app
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
